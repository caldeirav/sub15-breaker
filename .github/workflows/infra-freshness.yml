name: Infrastructure version freshness
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
jobs:
  reviewed-release-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check reviewed versions and expiring exceptions (no installation)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.infra.releases --output infra-freshness.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infra-freshness
          path: infra-freshness.json
