apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-sidecar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: decision-sidecar
  template:
    metadata:
      labels:
        app: decision-sidecar
    spec:
      containers:
        - name: decision-sidecar
          image: REPLACE_WITH_SIDECAR_IMAGE_WITH_TRAINED_MODEL
          # Dependencies are installed with uv at image build time, never at startup.
          workingDir: /app
          command: ["uv", "run", "--no-sync", "--no-dev", "uvicorn", "src.gateway.decision_sidecar:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          env:
            - name: RISK_MODEL_PATH
              value: /model
            - name: RISK_TEMPERATURE
              valueFrom:
                secretKeyRef:
                  name: risk-calibration
                  key: temperature
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: decision-sidecar
spec:
  selector:
    app: decision-sidecar
  ports:
    - port: 8000
      targetPort: 8000
