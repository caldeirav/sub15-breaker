# ActorTemplate is an ATE API object, not a Kubernetes CRD. Configure the
# atespace and image for the pinned Substrate release. The selected pool sets
# the sandbox class; ActorTemplate no longer accepts sandboxConfig.
metadata:
  atespace: breaker
  name: breaker-executor
workerSelector:
  matchLabels:
    workload: breaker
containers:
  - name: executor
    image: REPLACE_WITH_ISOLATED_EXECUTOR_IMAGE
resources:
  limits:
    cpuMillicores: 1000
    memoryBytes: 268435456
snapshotConfig:
  goldenSnapshotConfig:
    mode: GOLDEN_SNAPSHOT_MODE_DISABLED
