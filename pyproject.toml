[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "breaker-substrate"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "datasets>=3,<5",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "torch>=2.4",
  "transformers>=4.46,<5",
  "langgraph>=0.6,<2",
  "openai>=1.68,<3",
  "httpx>=0.27",
  "mlflow>=3.17,<4",
  "google-genai>=1",
  "streamlit>=1.40",
  "pandas>=2",
  "plotly>=5",
  "python-dotenv>=1",
  "scipy>=1.13",
  "pydantic>=2",
  "litellm>=1.77,<2",
  "agentdojo @ git+https://github.com/ethz-spylab/agentdojo.git@089ed468cf3ed0322acc66b0211f26d9d90dbf60",
  "pyjwt[crypto]>=2.10,<3",
  "langchain-core>=1.7.3,<2",
  "langchain-openai>=1,<2",
  "grpcio>=1.75,<2",
  "protobuf>=7,<8",
  "pyyaml>=6",
]

[dependency-groups]
agent-runtime = [
    "langchain-core>=1.7.3,<2",
    "langgraph>=1.2.19,<2",
]
banking-service = [
    "agentdojo",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.10,<3",
]
dev = [
    "cryptography>=44",
    "jsonschema>=4,<5",
    "pytest>=8",
    "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
agentdojo = { git = "https://github.com/ethz-spylab/agentdojo.git", rev = "089ed468cf3ed0322acc66b0211f26d9d90dbf60" }
