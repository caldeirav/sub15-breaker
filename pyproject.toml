[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "breaker-substrate"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "datasets>=3,<5", "fastapi>=0.115", "uvicorn>=0.34",
  "torch>=2.4", "transformers>=4.46,<5", "langgraph>=0.6,<2",
  "openai>=1.68,<3", "httpx>=0.27", "mlflow>=2.20,<4",
  "google-genai>=1", "streamlit>=1.40", "pandas>=2", "plotly>=5",
  "python-dotenv>=1", "scipy>=1.13", "pydantic>=2"
]

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
